name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      # main.go has `//go:embed all:frontend/dist`; a placeholder keeps a
      # standalone Go build/test happy without building the real frontend.
      - name: Stub embed dir
        run: mkdir -p frontend/dist && echo '<!-- ci stub -->' > frontend/dist/index.html

      # Explicit package list (not ./...) so Go never descends into
      # frontend/node_modules, which vendors a stray flatted/*.go package.
      - name: Build
        run: go build . ./internal/...

      - name: Test (race)
        run: go test -race . ./internal/...

      - name: golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.4.0
          "$(go env GOPATH)/bin/golangci-lint" run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
