# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Wails regenerates wailsjs/ (trailing tabs) and package.json.md5 (no
      # final newline) on every build; leave those generated files alone.
      - id: trailing-whitespace
        exclude: ^frontend/(wailsjs/|package\.json\.md5$)
      - id: end-of-file-fixer
        exclude: ^frontend/(wailsjs/|package\.json\.md5$)
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
        exclude: ^frontend/tsconfig(\.node)?\.json$  # tsconfig may have comments

  # Go hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
        name: go fmt
        entry: go fmt ./...
        language: system
        pass_filenames: false
      - id: go-imports
        name: goimports
        entry: goimports -w
        language: system
        types: [go]
        pass_filenames: true
      - id: go-mod-tidy

  - repo: local
    hooks:
      # Package patterns are explicit (not ./...) so Go tooling never descends
      # into frontend/node_modules, which vendors a stray flatted/*.go package.
      - id: go-vet
        name: go vet
        entry: go vet . ./internal/...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-build
        name: go build
        entry: go build . ./internal/...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-unit-tests
        name: go test
        entry: go test . ./internal/...
        language: system
        types: [go]
        pass_filenames: false
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run
        language: system
        types: [go]
        pass_filenames: false

      # Frontend hooks (JavaScript/TypeScript)
      - id: frontend-lint
        name: Frontend Lint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$

      - id: frontend-format
        name: Frontend Format Check
        entry: bash -c 'cd frontend && npm run format:check'
        language: system
        pass_filenames: false
        files: ^frontend/(src/|[^/]*\.(json|c?js|mjs))

      - id: frontend-tests
        name: Frontend Tests
        entry: bash -c 'cd frontend && npm test'
        language: system
        pass_filenames: false
        files: ^frontend/

      - id: frontend-typecheck
        name: Frontend Type Check
        entry: bash -c 'cd frontend && npx tsc --noEmit'
        language: system
        pass_filenames: false
        files: ^frontend/.*\.(ts|tsx)$
