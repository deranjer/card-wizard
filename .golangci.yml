version: "2"

run:
  timeout: 3m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - unparam
    - misspell
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # GetPDFLayout keeps an (T, error) return for Wails binding symmetry even
      # though the error is always nil; unparam would otherwise flag it.
      - path: app.go
        linters:
          - unparam

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
